<!DOCTYPE html>
<html lang="de">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Bibelquiz mit 3000 Fragen – allein oder zu zweit, in Deutsch und Englisch. Offline spielbar.">
  <meta name="theme-color" content="#0E1330">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- iOS meta tags & icons.
       WICHTIG: status-bar-style NICHT auf "black-translucent" setzen –
       Inhalt rutscht dann unter die Statusleiste und Flutter-Web trifft
       Taps ~60px versetzt (Quick Play traf das Duell darunter). -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lichtpfad">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Lichtpfad – Bibelquiz</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Weltraum-Nebel-Hintergrund (web/nebula.js) hinter der Flutter-App.
       Flutter wird im Web transparent gerendert (Scaffold + Starfield),
       damit der Nebel durchscheint. */
    html { background: #0c0f16; }
    body { margin: 0; background: transparent; }
    #space {
      position: fixed; inset: 0; z-index: -1;
      pointer-events: none; overflow: hidden; background: #0c0f16;
    }
    /* Canvas (opak) unten, Sterne darüber – sonst verdeckt der Nebel die Sterne. */
    .neb-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
    .neb-stars { position: absolute; inset: 0; z-index: 1; }
    .neb-star {
      position: absolute; border-radius: 50%; opacity: 0;
      animation-name: neb-twinkle; animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }
    @keyframes neb-twinkle { 0%,100% { opacity: .05 } 50% { opacity: .95 } }

    /* Fallback ohne WebGL: geblurte, morphende Farbflächen */
    .neb-fallback { position: absolute; inset: 0; overflow: hidden; filter: blur(60px); }
    .neb-blob { position: absolute; display: block; border-radius: 45% 55% 52% 48%; opacity: .55; }
    .b1 { width: 65vmax; height: 65vmax; left: -12vmax; top: -18vmax;
      background: radial-gradient(closest-side, #2b3e6b, transparent);
      animation: neb-morph 20s ease-in-out infinite; }
    .b2 { width: 58vmax; height: 58vmax; right: -16vmax; top: 8vmax;
      background: radial-gradient(closest-side, #7a4a2b, transparent);
      animation: neb-morph 26s ease-in-out infinite reverse; }
    .b3 { width: 48vmax; height: 48vmax; left: 22vmax; bottom: -14vmax;
      background: radial-gradient(closest-side, #c9a86a, transparent);
      animation: neb-morph 30s ease-in-out infinite; }
    @keyframes neb-morph {
      0%,100% { border-radius: 45% 55% 52% 48%; transform: translate(0,0) scale(1) }
      50% { border-radius: 55% 45% 46% 54%; transform: translate(4vmax,-3vmax) scale(1.12) }
    }
    .neb-readmask { position: absolute; inset: 0; filter: none;
      background: radial-gradient(ellipse 62% 42% at 50% 50%, #0c0f16 0%, rgba(12,15,22,0) 72%); }
    .neb-static .neb-blob { animation: none; }
  </style>
</head>
<body>
  <!-- Nebel-Hintergrund-Layer (wird von nebula.js gefüllt) -->
  <div id="space"></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Eigener PWA-Service-Worker (Flutters eingebauter ist deprecated;
    // Build erfolgt mit --pwa-strategy=none, damit nur dieser registriert wird).
    if ('serviceWorker' in navigator) {
      var hadController = !!navigator.serviceWorker.controller;
      var refreshing = false;
      // Übernimmt ein neuer Service-Worker die Kontrolle (neuer Deploy), einmal
      // neu laden -> index.html UND App-Code kommen konsistent aus der neuen
      // Cache-Generation. Verhindert "neuer Hintergrund blitzt, dann alter".
      // Beim Erstbesuch (kein Vorgänger-SW) NICHT neu laden.
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadController || refreshing) return;
        refreshing = true;
        window.location.reload();
      });
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
  <!-- Nebel-Hintergrund starten (vor Flutter, damit er sofort da ist) -->
  <script src="nebula.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
