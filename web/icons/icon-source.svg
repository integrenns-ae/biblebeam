<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="85%">
      <stop offset="0%" stop-color="#1B2350"/>
      <stop offset="60%" stop-color="#0E1330"/>
      <stop offset="100%" stop-color="#070A1C"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD98A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFD98A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD98A"/>
      <stop offset="100%" stop-color="#E7B85C"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- kleine Sterne -->
  <circle cx="120" cy="120" r="5" fill="#F4ECDD" opacity="0.7"/>
  <circle cx="392" cy="96" r="4" fill="#F4ECDD" opacity="0.55"/>
  <circle cx="430" cy="200" r="3" fill="#F4ECDD" opacity="0.45"/>
  <circle cx="86" cy="260" r="3.4" fill="#F4ECDD" opacity="0.5"/>
  <circle cx="150" cy="408" r="4" fill="#F4ECDD" opacity="0.5"/>
  <circle cx="400" cy="392" r="5" fill="#F4ECDD" opacity="0.6"/>
  <circle cx="330" cy="430" r="3" fill="#F4ECDD" opacity="0.4"/>
  <!-- Glow hinter dem Hauptfunken -->
  <circle cx="256" cy="244" r="190" fill="url(#glow)"/>
  <!-- Hauptfunke (vierstrahliger Stern) -->
  <path fill="url(#star)" d="M256 92
    C 266 180 290 212 376 234
    C 290 256 266 288 256 376
    C 246 288 222 256 136 234
    C 222 212 246 180 256 92 Z"/>
  <!-- Nebenfunke -->
  <path fill="url(#star)" opacity="0.9" d="M368 318
    C 372 352 382 364 414 372
    C 382 380 372 392 368 426
    C 364 392 354 380 322 372
    C 354 364 364 352 368 318 Z"/>
</svg>
